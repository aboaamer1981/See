name: Build Sedfa Digital Portal APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1 - Checkout
      # =========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================
      # 2 - Java 17
      # =========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================
      # 3 - Android SDK
      # =========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"


      # =========================================
      # 4 - Install required Android packages
      # =========================================
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platform-tools"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true


      # =========================================
      # 5 - Create Android Project
      # =========================================
      - name: Create Android Project
        shell: bash
        run: |

          set -e

          echo "Creating Sedfa Android Project..."

          mkdir -p SedfaApp/app/src/main/java/com/sedfa/portal
          mkdir -p SedfaApp/app/src/main/res/values


          # ---------------------------------------
          # settings.gradle
          # ---------------------------------------

          cat > SedfaApp/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SedfaPortal"

          include(":app")
          EOF


          # ---------------------------------------
          # Root build.gradle
          # ---------------------------------------

          cat > SedfaApp/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF


          # ---------------------------------------
          # app/build.gradle
          # ---------------------------------------

          cat > SedfaApp/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.sedfa.portal'

              compileSdk 34

              defaultConfig {

                  applicationId "com.sedfa.portal"

                  minSdk 21

                  targetSdk 34

                  versionCode 1

                  versionName "1.0"
              }

              buildTypes {

                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF


          # ---------------------------------------
          # strings.xml
          # ---------------------------------------

          cat > SedfaApp/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">بوابة صدفا الرقمية</string>

          </resources>
          EOF


          # ---------------------------------------
          # themes.xml
          # ---------------------------------------

          cat > SedfaApp/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#1565C0</item>

                  <item name="android:statusBarColor">#FFFFFF</item>

                  <item name="android:navigationBarColor">#FFFFFF</item>

                  <item name="android:windowLightStatusBar">true</item>

              </style>

          </resources>
          EOF


          # ---------------------------------------
          # AndroidManifest.xml
          # ---------------------------------------

          cat > SedfaApp/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application

                  android:allowBackup="true"

                  android:label="@string/app_name"

                  android:supportsRtl="true"

                  android:usesCleartextTraffic="false"

                  android:theme="@style/AppTheme">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true"

                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # ---------------------------------------
          # MainActivity.java
          # ---------------------------------------

          cat > SedfaApp/app/src/main/java/com/sedfa/portal/MainActivity.java <<'EOF'
          package com.sedfa.portal;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              private static final String APP_URL =
                  "https://script.google.com/macros/s/AKfycbwLxjLFbLIwYp3tWXk8NRgn5DlgvFxuvcjDLYB_fdtNCQbdIPf-OfIRdz2rrN65k9u6pg/exec";


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);


                  WebSettings settings = webView.getSettings();


                  // JavaScript
                  settings.setJavaScriptEnabled(true);


                  // Local Storage
                  settings.setDomStorageEnabled(true);


                  // Database
                  settings.setDatabaseEnabled(true);


                  // File / Content access
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);


                  // Responsive web application
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(false);


                  // JavaScript windows
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(true);


                  // Cookies
                  CookieManager cookies =
                      CookieManager.getInstance();

                  cookies.setAcceptCookie(true);

                  cookies.setAcceptThirdPartyCookies(
                      webView,
                      true
                  );


                  // Keep navigation inside the application
                  webView.setWebViewClient(
                      new WebViewClient()
                  );


                  // JavaScript dialogs / browser features
                  webView.setWebChromeClient(
                      new WebChromeClient()
                  );


                  // Open Sedfa Portal
                  webView.loadUrl(APP_URL);
              }


              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }
              }


              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();

                      webView.destroy();

                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF


          echo "Android project created successfully."


      # =========================================
      # 6 - Install Gradle
      # =========================================
      - name: Install Gradle 8.2.1
        shell: bash
        run: |

          set -e

          GRADLE_VERSION="8.2.1"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O /tmp/gradle.zip

          sudo mkdir -p /opt/gradle

          sudo unzip -q \
            /tmp/gradle.zip \
            -d /opt/gradle

          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          echo "Gradle ${GRADLE_VERSION} installed."


      # =========================================
      # 7 - Check environment
      # =========================================
      - name: Check Build Environment
        run: |

          echo "===== JAVA ====="

          java -version

          echo "===== GRADLE ====="

          gradle --version

          echo "===== ANDROID ====="

          sdkmanager --list_installed


      # =========================================
      # 8 - Build APK
      # =========================================
      - name: Build Debug APK
        working-directory: SedfaApp
        run: |

          set -e

          echo "Starting Android APK build..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo "APK BUILD SUCCESSFUL"


      # =========================================
      # 9 - Verify APK
      # =========================================
      - name: Verify APK
        shell: bash
        run: |

          set -e

          APK_PATH="SedfaApp/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then

              echo "ERROR: APK was not created."

              exit 1

          fi

          echo "================================="
          echo "APK CREATED SUCCESSFULLY"
          echo "================================="

          ls -lh "$APK_PATH"


      # =========================================
      # 10 - Upload APK
      # =========================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:

          name: Sedfa-Digital-Portal-APK

          path: SedfaApp/app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error
